[package]
name = "gbilling_rs"
version = "0.1.0"
edition = "2021"
description = "Modern warnet billing app built with Rust and egui"
license = "GPL-3.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
